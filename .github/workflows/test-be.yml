name: Test Annotator BE

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          
      - name: Build
        working-directory: annotator-be
        run: mvn --batch-mode -DskipTests package

      - name: Test
        working-directory: annotator-be
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true test

      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: annotator-be/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
