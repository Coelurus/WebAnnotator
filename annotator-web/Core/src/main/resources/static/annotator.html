<div class="main-content">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 20%;
            background-color: #f7f7f7;
            padding: 20px;
            height: 100vh;
            position: fixed;
        }

        .main-content {
            margin-left: 21%;
            padding: 20px;
        }

        .nav-link {
            cursor: pointer;
        }

        .container-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 20px;
        }

        .container-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .header-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-buttons select, .header-buttons input {
            margin-right: 15px;
        }
    </style>
    <div class="header-buttons">
        <div>
            <select>
                <option>Annotation Mode</option>
                <option>Mode 1</option>
                <option>Mode 2</option>
            </select>
            <input type="number" placeholder="Frame Speed"/>
            <button>New Annotation</button>
        </div>
        <div>
            <select>
                <option>Filter Annotations</option>
                <option>Filter 1</option>
                <option>Filter 2</option>
            </select>
            <label><input type="checkbox"/> Show Annotations</label>
            <label><input type="checkbox"/> Show AI</label>
        </div>
    </div>

    <div class="container-grid">
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 1</p>
        </div>
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 2</p>
        </div>
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 3</p>
        </div>
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 4</p>
        </div>
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 5</p>
        </div>
        <div>
            <img src="#" alt="annotation preview"/>
            <p>Annotation 6</p>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary">Previous</button>
        <button class="btn btn-secondary">Next</button>
    </div>
</div>
