<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="'Annotator - ' + ${id}">Annotator</title>
    <script type="importmap">
        {
            "imports": {
                "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.esm.min.js",
                "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/esm/popper.js",
                "htmx": "https://unpkg.com/htmx.org@1.9.2/dist/htmx.min.js"
            }
        }
    </script>
    <script type="module">
        import 'bootstrap';
        import 'htmx';
    </script>
</head>
<body>
<div class="main-content">
    <div class="header-buttons">
        <div>
            <label>
                <select>
                    <option>Annotation Mode</option>
                    <option>Mode 1</option>
                    <option>Mode 2</option>
                </select>
            </label>
            <label>
                <input type="number" placeholder="Frame Speed"/>
            </label>
            <button>New Annotation</button>
        </div>
        <div>
            <label>
                <select>
                    <option>Filter Annotations</option>
                    <option>Filter 1</option>
                    <option>Filter 2</option>
                </select>
            </label>
            <label><input type="checkbox"/> Show Annotations</label>
            <label><input type="checkbox"/> Show AI</label>
        </div>
    </div>

    <style>
        .container-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 10px;
        }
    </style>

    <div class="container-grid">
        <div th:each="frameNum : ${#numbers.sequence(1, imagesOnPage)}">
            <img src="https://via.placeholder.com/200" alt="annotation preview"
                 th:id="'image-' + ${frameNum}"
                 th:hx-get="'/projects/' + ${id} + '/frames/' + ${frameNum + (currentPage - 1) * imagesOnPage}"
                 th:hx-target="'#image-' + ${frameNum}"
                 hx-trigger="load"
                 hx-swap="outerHTML"
                 width="50"
                 height="50"/>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary"
                th:disabled="${currentPage == 1}"
                th:hx-get="'/annotator/' + ${id} + '/page/' + (${currentPage - 1})"
                hx-target="body"
                hx-swap="outerHTML">
            Previous
        </button>

        <button class="btn btn-secondary"
                th:disabled="${currentPage == totalPages}"
                th:hx-get="'/annotator/' + ${id} + '/page/' + (${currentPage + 1})"
                hx-target="body"
                hx-swap="outerHTML">Next
        </button>
    </div>
</div>
</body>
</html>
