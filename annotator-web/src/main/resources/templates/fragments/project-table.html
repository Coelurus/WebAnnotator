<th:block th:fragment="project-table">
    <th:block th:each="project : ${projects}">
        <tr>
            <td th:text="${project.getProjectName()}"></td>
            <td th:text="${project.getDeadline()}"></td>
            <td th:text="${project.getPriority()}"></td>
            <td th:text="${project.getTeam().getName()}"></td>
        </tr>
    </th:block>
</th:block>
