spring:
  application:
    name: annotator

  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB

  datasource:
    # url: jdbc:h2:file:./database/database
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        generate_statistics: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  security:
    jwt:
      secret-key: "secret"
      # secret-key: ${JWT_SECRET}

logging:
  level:
    root: info
    org:
      springframework: INFO
      hibernate:
        sql: INFO


management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: info, health, swaggerui, openapi
  health:
    db:
      enabled: true
    defaults:
      enabled: true
  observations:
    annotations:
      enabled: true

springdoc:
  use-management-port: true
  override-with-generic-response: false
  default-produces-media-type: application/json


app:
  ai:
    url: ${AI_URL:http://localhost:8081}
  file-system:
    path: ${FILE_SYSTEM_PATH:file_system}
    archive-extension: ${ARCHIVE_EXTENSION:.zip}
    image-extension: ${IMAGE_EXTENSION:.webp}

