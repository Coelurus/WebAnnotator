spring:
  application:
    name: annotator

  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/annotator}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:annotator}
    password: ${DB_PASSWORD:annotator_password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        generate_statistics: false

  security:
    jwt:
      secret-key: ${JWT_SECRET:}

  flyway:
    locations: classpath:db/migration/common

logging:
  level:
    root: info
    org:
      springframework: INFO
      hibernate:
        sql: INFO


management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: info, health, swaggerui, openapi
  health:
    db:
      enabled: true
    defaults:
      enabled: true
  observations:
    annotations:
      enabled: true

springdoc:
  use-management-port: true
  override-with-generic-response: false
  default-produces-media-type: application/json


app:
  ai:
    url: ${AI_URL:http://localhost:8081}
  file-system:
    path: ${FILE_SYSTEM_PATH:file_system}
    archive-extension: ${ARCHIVE_EXTENSION:.zip}
    image-extension: ${IMAGE_EXTENSION:.webp}

