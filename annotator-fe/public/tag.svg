  <!-- Hole in the center of the triangular top -->
  <circle cx="30" cy="10" r="5" fill="#fff" stroke="#333" stroke-width="2"></circle>

  <!-- Centered letter A -->
  <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333" dominant-baseline="middle">
    A
  </text>
</svg>
